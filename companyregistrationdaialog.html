<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>تم إرسال طلب التسجيل</title>

<link href="https://fonts.googleapis.com/css2?family=Alexandria:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>

<style>
*{
    font-family:'Alexandria',sans-serif;
}
body{
    background:#F1F8F8CF;
}
</style>

</head>
<body>

<section class="min-h-screen flex items-center justify-center px-4 py-10 bg-[#FAFCFC]">

    <div class="w-full max-w-[430px]">

        <!-- Card -->
        <div class="bg-white border border-[#E7EEEE] rounded-[32px] p-8 text-center shadow-[0_8px_40px_rgba(15,118,110,0.04)]">

            <!-- Success Icon -->
            <div class="flex justify-center mb-7">

                <div class="relative">

                    <!-- Green Badge -->
                    <div
                        class="absolute -top-1 -right-1 z-20 w-5 h-5 rounded-full bg-[#A3C614] border-2 border-white flex items-center justify-center shadow-sm">
                        <svg
                            class="w-2.5 h-2.5 text-white"
                            fill="currentColor"
                            viewBox="0 0 20 20">
                            <path
                                d="M9.049 2.927c.3-.921 1.603-.921 1.902 0l1.07 3.292a1 1 0 00.95.69h3.462c.969 0 1.371 1.24.588 1.81l-2.8 2.034a1 1 0 00-.364 1.118l1.07 3.292c.3.921-.755 1.688-1.54 1.118l-2.8-2.034a1 1 0 00-1.176 0l-2.8 2.034c-.784.57-1.838-.197-1.539-1.118l1.07-3.292a1 1 0 00-.364-1.118L2.98 8.719c-.783-.57-.38-1.81.588-1.81H7.03a1 1 0 00.95-.69l1.07-3.292z" />
                        </svg>
                    </div>

                    <!-- Dashed Circle -->
                    <div
                        class="absolute inset-0 scale-[1.35] rounded-full border-[2px] border-dashed border-[#DDE7E7]">
                    </div>

                    <!-- Main Circle -->
                    <div
                        class="relative w-20 h-20 rounded-full bg-[#0F766E] flex items-center justify-center">

                        <svg
                            class="w-9 h-9 text-white"
                            fill="none"
                            stroke="currentColor"
                            stroke-width="2.8"
                            viewBox="0 0 24 24">
                            <path
                                stroke-linecap="round"
                                stroke-linejoin="round"
                                d="M5 13l4 4L19 7" />
                        </svg>

                    </div>

                </div>

            </div>

            <!-- Title -->
            <h1 class="text-[#0F766E] text-[28px] font-bold leading-none mb-3">
                تم إرسال طلب التسجيل
            </h1>

            <!-- Subtitle -->
            <p class="text-[#374151] text-[14px] font-semibold mb-2">
                سيتم مراجعة بيانات الشركة والتواصل معكم قريباً
            </p>

            <p class="text-[#98A2B3] text-[13px] leading-6 max-w-[290px] mx-auto">
               لقد تم استلام مستنداتكم بنجاح، يقوم فريقنا حالياً بالتحقق من البيانات
لضمان أعلى معايير الجودة.
            </p>

            <!-- Steps -->
            <div class="mt-8">

                <!-- Labels -->
                <div class="flex items-center justify-between mb-3">

                    <div class="flex flex-col items-center gap-2">

                        <span
                            class="w-3 h-3 rounded-full bg-[#0F766E] ring-[4px] ring-[#D7ECEA]">
                        </span>

                        <span class="text-[12px] font-medium text-[#0F766E]">
                            تم التقديم
                        </span>

                    </div>

                    <div class="flex-1 h-[2px] bg-[#E5E7EB] mx-2 relative -mt-5">
                        <div class="absolute inset-y-0 right-0 w-1/2 bg-[#0F766E]"></div>
                    </div>

                    <div class="flex flex-col items-center gap-2">

                        <span
                            class="w-3 h-3 rounded-full bg-[#D1D5DB]">
                        </span>

                        <span class="text-[12px] font-medium text-[#98A2B3]">
                            قيد المراجعة
                        </span>

                    </div>

                </div>

            </div>

            <!-- Button -->
            <a
                href="/home.html"
                class="mt-8 h-12 rounded-2xl bg-[#0F766E] hover:bg-[#0d675f] transition-all duration-300 flex items-center justify-center gap-2 text-white text-[14px] font-semibold shadow-[0_12px_30px_rgba(15,118,110,0.18)]">

                <svg
                    class="w-4 h-4"
                    fill="currentColor"
                    viewBox="0 0 20 20">
                    <path
                        d="M10 3L3 10h2v7h4v-4h2v4h4v-7h2L10 3z" />
                </svg>

                العودة للرئيسية
            </a>

            <!-- Footer Links -->
            <div class="mt-7 pt-5 border-t border-[#EEF2F2]">

    <div class="flex items-center justify-center gap-4 text-[13px]">

        <a
            href="#"
            class="flex items-center gap-1.5 text-[#98A2B3] hover:text-[#0F766E] transition">

            <!-- Headset Icon -->
            <svg
                class="w-4 h-4"
                fill="none"
                stroke="currentColor"
                viewBox="0 0 24 24">
                <path
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    stroke-width="2"
                    d="M4 12a8 8 0 1116 0v4a2 2 0 01-2 2h-2v-6h4M4 12v4a2 2 0 002 2h2v-6H4" />
            </svg>

            <span>تواصل مع الدعم</span>
        </a>

        <span class="text-[#D6DADF]">|</span>

        <a
            href="#"
            class="flex items-center gap-1.5 text-[#98A2B3] hover:text-[#0F766E] transition">

            <!-- Alert Circle Icon -->
            <svg
                class="w-4 h-4"
                fill="none"
                stroke="currentColor"
                viewBox="0 0 24 24">
                <circle
                    cx="12"
                    cy="12"
                    r="9"
                    stroke-width="2" />
                <path
                    stroke-linecap="round"
                    stroke-width="2"
                    d="M12 8v5" />
                <circle
                    cx="12"
                    cy="16.5"
                    r="1"
                    fill="currentColor"
                    stroke="none" />
            </svg>

            <span>حالة الطلب</span>
        </a>

    </div>

</div>

        </div>

        <!-- Reference Number -->
        <div class="text-center mt-7">

            <p class="text-[12px] text-[#98A2B3] mb-3">
                رقم المرجع
            </p>

            <div
                class="inline-flex items-center gap-2 px-4 py-2.5 bg-white border border-[#E5E7EB] rounded-full shadow-sm">

                <img
                    src="/imgs/copy1.svg"
                    alt="GitHub Logo"
                    class="w-4 h-4">

                <span class="text-[#0F766E] text-[14px] font-bold tracking-wide">
                    #REG-2024-88421
                </span>

            </div>

        </div>

    </div>

</section>

</body>
</html>
