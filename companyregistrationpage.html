<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>تسجيل شركة</title>

<link href="https://fonts.googleapis.com/css2?family=Alexandria:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
<script src="https://cdn.tailwindcss.com"></script>

<style>
*{
    font-family:'Alexandria',sans-serif;
}

body{
    background:#F3F5F5;
}

.input-style{
    @apply w-full h-12 rounded-xl border border-gray-200 bg-[#F8FAFB] px-4 text-sm outline-none transition;
}

.input-style:focus{
    border-color:#0F766E;
    box-shadow:0 0 0 3px rgba(15,118,110,.08);
}

.label-required::after{
    content:" *";
    color:#DC2626;
}
</style>
</head>

<body>

<section class="py-6 md:py-10 px-4">
    <div class="max-w-6xl mx-auto bg-[#FAFAFA] rounded-[28px] p-5 md:p-8 lg:p-10 shadow-sm border border-gray-100">

        <form class="space-y-10">

            <div>

                <div class="flex items-center gap-3 mb-8">
                    <div class="w-8 h-8 rounded-full bg-[#EAF7F4] flex items-center justify-center">
                       <img src="/imgs/saveaccount.svg" class="w-4 h-4" />
                    </div>

                    <h2 class="text-[#0F766E] text-xl md:text-2xl font-semibold">
                        بيانات الحساب
                    </h2>
                </div>

                <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-5">

                    <!-- username -->
                    <div>
                        <label class="label-required block mb-2 text-sm text-gray-700">
                            اسم المستخدم
                        </label>

                        <div class="relative">
                            <input
                                type="text"
                                placeholder="اسم فريد للدخول"
                                class="w-full h-12 rounded-xl border border-gray-200 bg-[#F7F8FA] pr-10 pl-4 text-sm focus:outline-none focus:border-[#0F766E]"
                            />

                            <svg class="w-4 h-4 absolute right-4 top-1/2 -translate-y-1/2 text-gray-400"
                                fill="currentColor"
                                viewBox="0 0 20 20">
                                <path d="M10 10a4 4 0 100-8 4 4 0 000 8zm0 2c-3.3 0-6 2.7-6 6h12c0-3.3-2.7-6-6-6z"/>
                            </svg>
                        </div>
                    </div>

                    <!-- email -->
                    <div>
                        <label class="label-required block mb-2 text-sm text-gray-700">
                            البريد الإلكتروني
                        </label>

                        <div class="relative">
                            <input
                                type="email"
                                placeholder="example@company.com"
                                class="w-full h-12 rounded-xl border border-gray-200 bg-[#F7F8FA] pr-10 pl-4 text-sm focus:outline-none focus:border-[#0F766E]"
                            />

                            <img src="/imgs/email.svg" class="w-4 h-4 absolute right-4 top-1/2 -translate-y-1/2 text-gray-400" />
                            
                        </div>
                    </div>

                    <!-- password -->
                    <div>
                        <label class="label-required block mb-2 text-sm text-gray-700">
                            كلمة المرور
                        </label>

                        <div class="relative">
                            <input
                                type="password"
                                placeholder="••••••••"
                                class="w-full h-12 rounded-xl border border-gray-200 bg-[#F7F8FA] pr-10 pl-4 text-sm focus:outline-none focus:border-[#0F766E]"
                            />

                            <svg class="w-4 h-4 absolute right-4 top-1/2 -translate-y-1/2 text-gray-400"
                                fill="currentColor"
                                viewBox="0 0 20 20">
                                <path d="M5 8V6a5 5 0 1110 0v2h1v10H4V8h1zm2 0h6V6a3 3 0 10-6 0v2z"/>
                            </svg>
                        </div>
                    </div>

                </div>
            </div>

            <!-- بيانات الشركة -->
            <div>

                <div class="flex items-center gap-3 mb-8">
                    <div class="w-8 h-8 rounded-full bg-[#EAF7F4] flex items-center justify-center">
                       <img src="/imgs/infocompany.svg" class="w-4 h-4" />
                    </div>

                    <h2 class="text-[#0F766E] text-xl md:text-2xl font-semibold">
                        بيانات الشركة
                    </h2>
                </div>

                <div class="grid grid-cols-1 md:grid-cols-2 gap-5">

                    <!-- نوع التسجيل -->
                    <div>
    <label class="label-required block mb-2 text-sm text-gray-700">
        نوع التسجيل
    </label>

    <div class="relative">
        <!-- أيقونة -->
        <span class="absolute right-4 top-1/2 -translate-y-1/2 text-gray-400 pointer-events-none z-10">
            <img src="/imgs/companytype.svg" class="w-5 h-5" />
        </span>

        <select
            class="w-full h-12 rounded-xl border border-gray-200 bg-[#F7F8FA] pr-12 pl-10 text-sm appearance-none focus:outline-none focus:border-[#0F766E]">
            <option>شركة محلية</option>
            <option>شركة دولية</option>
        </select>

      
    </div>
</div>

                    <!-- الرقم الضريبي -->
                    <div>
    <label class="label-required block mb-2 text-sm text-gray-700">
        الرقم الضريبي
    </label>

    <div class="relative">
        <!-- أيقونة الرقم الضريبي -->
        <span class="absolute right-4 top-1/2 -translate-y-1/2 text-gray-400 pointer-events-none">
            <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" fill="none"
                viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8">
                <path stroke-linecap="round" stroke-linejoin="round"
                    d="M9 14h6m-6-4h6m3 10H6a2 2 0 01-2-2V6a2 2 0 012-2h9l5 5v9a2 2 0 01-2 2z" />
            </svg>
        </span>

        <input
            type="text"
            placeholder="CR Number"
            class="w-full h-12 rounded-xl border border-gray-200 bg-[#F7F8FA] pr-12 pl-4 text-sm focus:outline-none focus:border-[#0F766E]"
        />
    </div>
</div>

                    <!-- الرقم التجاري -->
                    <div>
    <label class="label-required block mb-2 text-sm text-gray-700">
        رقم السجل التجاري
    </label>

    <div class="relative">
        <input
            type="text"
            placeholder="أدخل رقم الرخصة"
            class="w-full h-12 rounded-xl border border-gray-200 bg-[#F7F8FA] px-4 pr-12 text-sm focus:outline-none focus:border-[#0F766E]"
        />
        
        <!-- أيقونة السجل التجاري (SVG) -->
        <img src="/imgs/commercialrecord.svg" class="w-5 h-5 absolute right-4 top-1/2 -translate-y-1/2 text-gray-400" />
    </div>
</div>

                    <!-- اسم الشركة عربي -->
                    <div>
    <label class="label-required block mb-2 text-sm text-gray-700">
        اسم الشركة (عربي)
    </label>

    <div class="relative">
        <input
            type="text"
            placeholder="أدخل اسم المنشأة بالكامل"
            class="w-full h-12 rounded-xl border border-gray-200 bg-[#F7F8FA] px-4 pr-12 text-sm focus:outline-none focus:border-[#0F766E]"
        />
        
        <img src="/imgs/companyname.svg" class="w-5 h-5 absolute right-4 top-1/2 -translate-y-1/2 text-gray-400" />
    </div>
</div>

                    <!-- اسم الشركة التجاري -->
                    <div>
    <label class="label-required block mb-2 text-sm text-gray-700">
        اسم الشركة (انجليزي)
    </label>

    <div class="relative">
        <input
            type="text"
            placeholder="Company Full Name"
            class="w-full h-12 rounded-xl border border-gray-200 bg-[#F7F8FA] px-4 pr-12 text-sm focus:outline-none focus:border-[#0F766E]"
        />
        
        <img src="/imgs/companyname-en.svg" class="w-5 h-5 absolute right-4 top-1/2 -translate-y-1/2 text-gray-400" />
    </div>
</div>

                    <!-- عنوان الشركة -->
                    <div>
    <label class="label-required block mb-2 text-sm text-gray-700">
        عنوان الشركة
    </label>

    <div class="relative">
        <input
            type="text"
            placeholder="المدينة، الحي، الشارع"
            class="w-full h-12 rounded-xl border border-gray-200 bg-[#F7F8FA] px-4 pr-12 text-sm focus:outline-none focus:border-[#0F766E]"
        />
        
        <!-- أيقونة الموقع (SVG) -->
        <svg class="w-5 h-5 absolute right-4 top-1/2 -translate-y-1/2 text-gray-400" 
             fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" 
                  d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z"></path>
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" 
                  d="M15 11a3 3 0 11-6 0 3 3 0 016 0z"></path>
        </svg>
    </div>
</div>

                    <!-- هاتف الشركة -->
                   <div>
    <label class="block mb-2 text-sm text-gray-700">
        هاتف الشركة
    </label>

    <div class="relative w-full">
        <input
            type="tel"
            placeholder="011XXXXXXX"
            class="w-full h-12 rounded-xl border border-gray-200 bg-[#F7F8FA] px-12 text-sm placeholder:text-right"
        />
        
        <span class="absolute right-4 top-1/2 -translate-y-1/2 text-gray-400">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 5a2 2 0 012-2h3.28a1 1 0 01.948.684l1.498 4.493a1 1 0 01-.502 1.21l-2.257 1.13a11.042 11.042 0 005.516 5.516l1.13-2.257a1 1 0 011.21-.502l4.493 1.498a1 1 0 01.684.949V19a2 2 0 01-2 2h-1C9.716 21 3 14.284 3 6V5z"></path>
            </svg>
        </span>
    </div>
</div>

                    <!-- فاكس -->
                   <div>
    <label class="block mb-2 text-sm text-gray-700">
        الفاكس (اختياري)
    </label>

    <div class="relative w-full">
        <span class="absolute right-4 top-1/2 -translate-y-1/2 text-gray-400">
            <img src="/imgs/fax.svg" class="w-5 h-5" />
        </span>

        <input
            type="tel"
            placeholder="011XXXXXXX"
            class="w-full h-12 rounded-xl border border-gray-200 bg-[#F7F8FA] pr-12 pl-4 text-sm text-right placeholder:text-right focus:outline-none focus:border-[#0F766E]"
        />
    </div>
</div>

                    <!-- اسم المسؤول -->
                    <div>
    <label class="label-required block mb-2 text-sm text-gray-700">
        اسم الشخص المسؤول
    </label>

    <div class="relative w-full">
        <span class="absolute right-4 top-1/2 -translate-y-1/2 text-gray-400">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path>
            </svg>
        </span>

        <input
            type="text"
            placeholder="الاسم الرباعي"
            class="w-full h-12 rounded-xl border border-gray-200 bg-[#F7F8FA] pr-12 pl-4 text-sm text-right placeholder:text-right focus:outline-none focus:border-[#0F766E]"
        />
    </div>
</div>

                    <!-- الجوال -->
                    <div>
    <label class="label-required block mb-2 text-sm text-gray-700">
        رقم الجوال
    </label>

    <div class="relative w-full">
        <span class="absolute right-4 top-1/2 -translate-y-1/2 text-gray-400">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 18h.01M8 21h8a2 2 0 002-2V5a2 2 0 00-2-2H8a2 2 0 00-2 2v14a2 2 0 002 2z"></path>
            </svg>
        </span>

        <input
            type="tel"
            placeholder="05XXXXXXXX"
            class="w-full h-12 rounded-xl border border-gray-200 bg-[#F7F8FA] pr-12 pl-4 text-sm text-right placeholder:text-right focus:outline-none focus:border-[#0F766E]"
        />
    </div>
</div>

                    <!-- البريد -->
                    <div class="md:col-span-2">
    <label class="label-required block mb-2 text-sm text-gray-700">
        البريد الإلكتروني للتواصل الرسمي
    </label>

    <div class="relative w-full">
        <span class="absolute right-4 top-1/2 -translate-y-1/2 text-gray-400">
            <img src="/imgs/email@.svg" class="w-5 h-5" />
        </span>

        <input
            type="email"
            placeholder="contact@company.com"
            class="w-full h-12 rounded-xl border border-gray-200 bg-[#F7F8FA] pr-12 pl-4 text-sm text-right placeholder:text-right focus:outline-none focus:border-[#0F766E]"
        />
    </div>
</div>

                </div>
            </div>
            <div class="flex flex-col gap-2">
    <label class="text-sm font-medium text-gray-700">إرفاق ملفات الشركة*</label>
    
    <div class="flex items-center">
        <input type="file" id="company-files" class="hidden" />
        
        <label for="company-files" 
               class="bg-[#0F766E] text-white px-6 py-3 rounded-lg cursor-pointer hover:bg-[#0d6a63] transition-colors text-sm font-medium flex items-center justify-center">
            إرفاق ملف / ملفات
        </label>
    </div>
</div>
            <!-- الشروط -->
            <div class="flex items-start gap-3 text-sm text-gray-600">
                <input
                    type="checkbox"
                    class="mt-1 w-4 h-4 accent-[#0F766E]"
                />

                <p class="leading-7">
                    أقر أنني المفوض عن الشركة بصحة كافة البيانات المذكورة أعلاه وأوافق على
                    <a href="#" class="text-[#0F766E] font-medium">
                        الشروط والأحكام
                    </a>
                    و
                    <a href="#" class="text-[#0F766E] font-medium">
                        سياسة الخصوصية
                    </a>
                    الخاصة بالمنصة.
                </p>
            </div>

            <!-- زر التسجيل -->
            <div class="text-center">

              <button
    type="button"
    onClick="window.location.href='companyregistrationdaialog.html'"
    class="inline-flex items-center justify-center bg-[#0F766E] hover:bg-[#0c5f59] text-white font-semibold h-14 px-10 rounded-xl min-w-[260px] shadow-[0_10px_25px_rgba(15,118,110,.25)] transition"
>
    <img src="/imgs/row-white.svg" class="w-4 h-4 ml-2" />
    تسجيل الشركة
</button>
                <p class="mt-5 text-sm text-gray-600">
                    لديك حساب بالفعل؟
                    <a href="#" class="text-[#0F766E] font-semibold">
                        تسجيل الدخول
                    </a>
                </p>

            </div>

        </form>

    </div>
</section>

</body>
</html>
